<div
  *ngIf="(enrolledIds$ | async) as enrolledIds"
  class="course-card"
  [ngClass]="{
    'card--enrolled': enrolledIds.includes(course.id),
    'card--full': course.credits >= 4,
    'expanded': isExpanded
  }"
  [ngStyle]="cardStyle"
>
  <div class="card-header">
    <h3>{{ course.name }}</h3>

    <div [ngSwitch]="course.gradeStatus" class="status-container">
      <span *ngSwitchCase="'passed'" class="badge badge-passed">Passed</span>
      <span *ngSwitchCase="'failed'" class="badge badge-failed">Failed</span>
      <span *ngSwitchCase="'pending'" class="badge badge-pending">Pending</span>
      <span *ngSwitchDefault class="badge badge-pending">Pending</span>
    </div>
  </div>

  <p><strong>ID:</strong> {{ course.id }}</p>
  <p><strong>Code:</strong> {{ course.code }}</p>

  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>

  <div class="actions">
    <button (click)="toggleEnrollment(enrolledIds.includes(course.id))" class="btn-enroll">
      {{ enrolledIds.includes(course.id) ? 'Unenroll' : 'Enroll' }}
    </button>

    <button (click)="toggleDetails()" class="btn-details">
      {{ isExpanded ? 'Hide Details' : 'Show Details' }}
    </button>
  </div>

  <div *ngIf="isExpanded" class="extra-details">
    <p><em>Detailed course overview: Core module for computer science curriculum.</em></p>
  </div>
</div>
