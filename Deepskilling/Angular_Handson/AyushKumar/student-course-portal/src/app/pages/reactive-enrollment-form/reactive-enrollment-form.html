<h2>Reactive Student Enrollment Request</h2>

<div *ngIf="submitted" class="success-msg">
  Enrollment request submitted successfully!
</div>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="studentName">Student Name:</label>
    <input
      type="text"
      id="studentName"
      formControlName="studentName"
    />
    <div *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors" class="error-container">
      <span *ngIf="enrollForm.get('studentName')?.errors?.['required']" class="error-msg">Name is required</span>
      <span *ngIf="enrollForm.get('studentName')?.errors?.['minlength']" class="error-msg">Name must be at least 3 characters</span>
    </div>
  </div>

  <div class="form-group">
    <label for="studentEmail">Student Email:</label>
    <input
      type="email"
      id="studentEmail"
      formControlName="studentEmail"
    />
    <div *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors" class="error-container">
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['required']" class="error-msg">Email is required</span>
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['email']" class="error-msg">Invalid email format</span>
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']" class="error-msg">Email taken</span>
    </div>
  </div>

  <div class="form-group">
    <label for="courseId">Course ID / Code:</label>
    <input
      type="text"
      id="courseId"
      formControlName="courseId"
    />
    <div *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.errors" class="error-container">
      <span *ngIf="enrollForm.get('courseId')?.errors?.['required']" class="error-msg">Course ID is required</span>
      <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']" class="error-msg">Course code starting with XX is not allowed.</span>
    </div>
  </div>

  <div class="form-group">
    <label for="preferredSemester">Preferred Semester:</label>
    <select id="preferredSemester" formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div class="form-group checkbox-group">
    <label>
      <input type="checkbox" formControlName="agreeToTerms" />
      I agree to the terms and conditions
    </label>
    <div *ngIf="enrollForm.get('agreeToTerms')?.touched && enrollForm.get('agreeToTerms')?.errors" class="error-container">
      <span *ngIf="enrollForm.get('agreeToTerms')?.errors?.['required']" class="error-msg">You must agree to terms</span>
    </div>
  </div>

  <div class="form-group dynamic-section">
    <h3>Additional Courses</h3>
    <button type="button" (click)="addCourse()" class="btn-secondary">Add Another Course</button>

    <div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="dynamic-control-row">
      <input [formControl]="getControl(ctrl)" placeholder="Course Code" />
      <button type="button" (click)="removeCourse(i)" class="btn-danger">Remove</button>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="enrollForm.invalid" class="btn-primary">Submit</button>
    <button type="button" (click)="onReset()" class="btn-secondary">Reset</button>
  </div>
</form>
