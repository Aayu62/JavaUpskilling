<h2>Course Details</h2>

<div *ngIf="course; else notFound" class="detail-card">
  <h3>{{ course.name }}</h3>
  <p><strong>Course ID:</strong> {{ course.id }}</p>
  <p><strong>Course Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>
  <p><strong>Grade Status:</strong> <span class="badge">{{ course.gradeStatus }}</span></p>

  <div class="actions">
    <button (click)="goBack()" class="btn-secondary">Back to Courses</button>
  </div>
</div>

<ng-template #notFound>
  <p class="error-msg">Course not found for specified ID.</p>
  <button (click)="goBack()" class="btn-secondary">Back to Courses</button>
</ng-template>
