<h1>{{ portalName }}</h1>

<p>
  Manage your courses, view your profile, and track your academic progress
  from one place.
</p>

<div class="stats">
  <div class="card">
    <h3>Courses Available</h3>
    <p>{{ availableCoursesCount }}</p>
  </div>

  <div class="card">
    <h3>Enrolled</h3>
    <p>{{ enrolledCoursesCount }}</p>
  </div>

  <div class="card">
    <h3>GPA</h3>
    <p>3.8</p>
  </div>
</div>
<hr>

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<input
  type="text"
  placeholder="Search courses..."
  [(ngModel)]="searchTerm">

<p>Searching for: {{ searchTerm }}</p>

<app-course-summary-widget></app-course-summary-widget>
<app-notification></app-notification>
